<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#132b0b" />
    <title>Baby Kam Kam — Invitation Opening</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #132b0b; }
      #canvas3d { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <canvas id="canvas3d" aria-label="Baby Kam Kam invitation opening"></canvas>
    <script type="module">
      import { Application } from 'https://cdn.spline.design/@splinetool/runtime@2.0.186/build/runtime.js';

      const canvas = document.getElementById('canvas3d');
      const app = new Application(canvas, { htmlContentMode: 'inline' });
      app.load('./assets/scene.splinecode');
    </script>
  </body>
</html>
