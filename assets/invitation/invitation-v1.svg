<svg xmlns="http://www.w3.org/2000/svg" width="1092" height="1456" viewBox="0 0 1092 1456" role="img" aria-labelledby="title description">
  <title id="title">Child dedication invitation for Anaya Kamsiyochukwu</title>
  <desc id="description">A vintage ivory, burgundy and gold invitation from Engr. and Mrs. Asogwa.</desc>

  <image href="vintage-background-v1.png" width="1092" height="1456" preserveAspectRatio="none"/>

  <g text-anchor="middle" fill="#4c352f">
    <text x="546" y="267" fill="#9a7426" font-family="Georgia, serif" font-size="23" font-weight="700" letter-spacing="7">WITH JOYFUL HEARTS</text>
    <text x="546" y="318" fill="#501427" font-family="Palatino Linotype, Book Antiqua, Georgia, serif" font-size="38" font-weight="700" letter-spacing="1.5">Engr. &amp; Mrs. Asogwa</text>
    <text x="546" y="363" font-family="Georgia, serif" font-size="27" font-style="italic">warmly invite you to celebrate the</text>

    <g stroke="#9a7426" stroke-width="1.5">
      <line x1="337" y1="402" x2="485" y2="402"/>
      <line x1="607" y1="402" x2="755" y2="402"/>
    </g>
    <text x="546" y="411" fill="#9a7426" font-family="Georgia, serif" font-size="24">❦</text>

