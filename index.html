    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #2a0d12;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #canvas3d {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: manipulation;
      }
      .loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #2a0d12;
        color: #f7e6c4;
        z-index: 9999;
        transition: opacity 0.8s ease, visibility 0.8s;
        pointer-events: none;
      }
      .loader.is-hidden {
        opacity: 0;
        visibility: hidden;
      }
      .loader__spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(247, 230, 196, 0.2);
        border-top-color: #d4af37;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-bottom: 14px;
      }
      .loader__text {
        font-size: 14px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 500;
        color: rgba(247, 230, 196, 0.9);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

    <div class="loader" id="loader" role="status" aria-live="polite">
      <div class="loader__spinner"></div>
      <div class="loader__text">Loading invitation…</div>
    </div>

    <canvas id="canvas3d"></canvas>

    <script type="module">
      // Mobile budget optimization: cap devicePixelRatio to prevent GPU thermal freezing
      const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || window.innerWidth < 768;
      const maxDPR = isMobile ? 1.0 : 1.5;

      try {
        if (window.devicePixelRatio > maxDPR) {
          Object.defineProperty(window, 'devicePixelRatio', {
            get() { return maxDPR; },
            configurable: true
          });
        }
      } catch (e) {}

      import { Application } from 'https://cdn.spline.design/@splinetool/runtime@2.0.180/build/runtime.js';

      const canvas = document.getElementById('canvas3d');
      const loader = document.getElementById('loader');

      const app = new Application(canvas);

      app.load('https://prod.spline.design/uDv5ybrM-NXZYv0H/scene.splinecode?v=20261116-camera-fix')
        .then(() => {
          if (app._renderer) {
            app._renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, maxDPR));
          }
          // Scene geometry is ready, but GPU textures and material saturation need
          // extra time to fully resolve. Hold the loader for 2.5s so the first
          // frame the user sees is fully saturated and colour-rich.
          if (loader.querySelector('.loader__text')) {
            loader.querySelector('.loader__text').textContent = 'Preparing invitation\u2026';
          }
          return new Promise(resolve => setTimeout(resolve, 2500));
        })
        .then(() => {
          loader.classList.add('is-hidden');
        })
        .catch((err) => {
          console.error('Failed to load Spline scene:', err);
          loader.innerHTML = '<p style="color:#f7e6c4;padding:24px;text-align:center;">Failed to load 3D invitation. Please refresh.</p>';
        });

      window.addEventListener('resize', () => {
        if (app._renderer) {
          app._renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, maxDPR));
        }
      });
    </script>
