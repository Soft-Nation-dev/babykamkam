<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="../assets/seal.png"><title>Baby Kam Kam | RSVP Records</title><style>
:root{color-scheme:light;font-family:system-ui,sans-serif;color:#492330;background:#f8f3e9}*{box-sizing:border-box}body{margin:0 auto;max-width:1180px;padding:clamp(20px,5vw,64px);background:radial-gradient(ellipse at top right,#ead7b4,transparent 55%);min-height:100dvh}header{border-bottom:1px solid #c7aa744f;padding-bottom:24px;margin-bottom:28px}.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#92713e}h1{font:400 clamp(34px,6vw,58px)/1.1 Georgia;margin:12px 0}header p{color:#856c70}#login{max-width:420px;margin:8vh auto 0;padding:32px;background:#fffdf8;border:1px solid #dfcda9;border-radius:24px;box-shadow:0 20px 60px #51203012;display:grid;gap:16px}#login label{display:grid;gap:12px}input,button,select{font:inherit;padding:13px 16px;border:1px solid #d5c4a8;border-radius:12px;background:#fffdf8;color:#482c30}button{background:#592839;color:#fff9eb;cursor:pointer;transition:transform .18s,background .18s}button:hover{background:#793c50}button:active{transform:scale(.97)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ad8550;outline-offset:3px}#stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:28px 0}#stats span{display:grid;gap:12px;padding:22px;background:#fffdf8;border:1px solid #e4d5ba;border-radius:18px;box-shadow:0 8px 24px #51203008;font-size:13px;color:#856c70}#stats strong{font:400 38px Georgia;color:#592839}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;align-items:center}.toolbar input{flex:1;min-width:180px}section{overflow:auto;border:1px solid #dfcda9;border-radius:18px;background:#fffdf8}table{border-collapse:collapse;width:100%;min-width:630px}td,th{text-align:left;padding:16px;border-bottom:1px solid #eadfce}th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:#f1e8da}td{font-size:14px}tbody tr:hover{background:#faf3e7}.tag{display:inline-block;padding:5px 10px;border-radius:99px;font-size:12px;background:#e5ebdf;color:#3e573b}.tag.no{background:#f2e0de;color:#873b3d}#status{text-align:center;color:#80513d}main{animation:arrive .35s ease both}@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><header><div class="eyebrow">Baby Kam Kam · Private administration</div><h1>Guest records</h1><p>Sunday, 13 December 2026 · Reception</p></header><form id="login"><div class="eyebrow">Host access</div><h2 style="font-family:Georgia;margin:0">Welcome back</h2><label>Access password <input type="password" required autocomplete="off" placeholder="Access password"></label> <button>Sign in</button></form><p id="status" role="status"></p><main hidden><div id="stats"></div><div class="toolbar"><input id="search" placeholder="Search name or phone" aria-label="Search records"><select id="filter" aria-label="Filter attendance"><option value="">All responses</option><option value="yes">Accepted</option><option value="no">Declined</option></select><button id="refresh">Refresh</button><button id="export">Export CSV</button><button id="logout">Sign out</button></div><section><table><thead><tr><th>Name</th><th>Phone</th><th>Attendance</th><th>Persons</th><th>Submitted (UTC)</th></tr></thead><tbody></tbody></table></section></main><script type="module">let token='',rows=[];const q=s=>document.querySelector(s),msg=q('#status');async function load(){const c=await(await fetch('../api-config.json',{cache:'no-store'})).json();if(!c.apiBase)throw Error('Backend not configured');const r=await fetch(c.apiBase.replace(/\/$/,'')+'/api/records',{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!r.ok)throw Error([401,403].includes(r.status)?'Incorrect access password':'Unable to load records');rows=(await r.json()).records;renderRows();q('#stats').replaceChildren(...['RSVPs: '+rows.length,'Confirmed persons: '+rows.reduce((a,r)=>a+r.guests,0),'Accepted: '+rows.filter(r=>r.attendance==='yes').length,'Declined: '+rows.filter(r=>r.attendance==='no').length].map(t=>{const s=document.createElement('span');const i=t.lastIndexOf(': ');s.textContent=t.slice(0,i);const n=document.createElement('strong');n.textContent=t.slice(i+2);s.append(n);return s}));q('main').hidden=false;q('#login').hidden=true;msg.textContent=''}function renderRows(){const body=q('tbody'),term=q('#search').value.toLowerCase().trim(),filter=q('#filter').value;body.replaceChildren();const list=rows.filter(r=>(!filter||r.attendance===filter)&&[r.name,r.phone].some(v=>String(v??'').toLowerCase().includes(term)));for(const row of list){const tr=document.createElement('tr');for(const [i,v] of [row.name,row.phone,row.attendance==='yes'?'Accepted':'Declined',row.guests,row.created_at].entries()){const td=document.createElement('td');if(i===2){const tag=document.createElement('span');tag.className='tag '+(row.attendance==='no'?'no':'');tag.textContent=v;td.append(tag)}else td.textContent=v;tr.append(td)}body.append(tr)}if(!list.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=5;td.textContent='No matching RSVPs yet.';tr.append(td);body.append(tr)}}q('#search').oninput=renderRows;q('#filter').onchange=renderRows;q('#login').onsubmit=async e=>{e.preventDefault();token=q('input').value;q('input').value='';try{await load()}catch(e){token='';msg.textContent=e.message}};q('#refresh').onclick=()=>load().catch(e=>msg.textContent=e.message);q('#logout').onclick=()=>{token='';rows=[];q('tbody').replaceChildren();q('#stats').replaceChildren();q('main').hidden=true;q('#login').hidden=false};q('#export').onclick=()=>{const quote=v=>{let s=String(v??'');if(/^[=+@\\-\\t\\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};const keys=['name','phone','attendance','guests','created_at'];const csv=[keys.join(','),...rows.map(r=>keys.map(k=>quote(r[k])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download='baby-kamkam-rsvp.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};</script></html>
