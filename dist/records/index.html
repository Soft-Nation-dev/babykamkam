<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baby Kam Kam | RSVP Records</title><style>body{font:16px system-ui;background:#f8f2e8;color:#482c30;max-width:1000px;margin:40px auto;padding:20px}h1{font-family:Georgia}input,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #b8a17c}button{background:#482c30;color:white;cursor:pointer}#stats{display:flex;gap:16px;flex-wrap:wrap;margin:22px 0}#stats span{background:white;padding:18px;border-radius:12px}table{border-collapse:collapse;width:100%;background:white}td,th{text-align:left;padding:12px;border-bottom:1px solid #ddd}section{overflow:auto} [hidden]{display:none!important}</style><h1>Baby Kam Kam · Records</h1><form id="login"><label>Admin access <input type="password" required autocomplete="off" placeholder="Access password"></label> <button>Sign in</button></form><p id="status" role="status"></p><main hidden><button id="refresh">Refresh</button> <button id="export">Export CSV</button> <button id="logout">Sign out</button><div id="stats"></div><section><table><thead><tr><th>Name</th><th>Phone</th><th>Attendance</th><th>Persons</th><th>Submitted (UTC)</th></tr></thead><tbody></tbody></table></section></main><script type="module">let token='',rows=[];const q=s=>document.querySelector(s),msg=q('#status');async function load(){const c=await(await fetch('../api-config.json',{cache:'no-store'})).json();if(!c.apiBase)throw Error('Backend not configured');const r=await fetch(c.apiBase.replace(/\/$/,'')+'/api/records',{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!r.ok)throw Error(r.status===401?'Incorrect access password':'Unable to load records');rows=(await r.json()).records;const body=q('tbody');body.replaceChildren();for(const row of rows){const tr=document.createElement('tr');for(const v of [row.name,row.phone,row.attendance==='yes'?'Accepted':'Declined',row.guests,row.created_at]){const td=document.createElement('td');td.textContent=v;tr.append(td)}body.append(tr)}q('#stats').replaceChildren(...['RSVPs: '+rows.length,'Confirmed persons: '+rows.reduce((a,r)=>a+r.guests,0),'Accepted: '+rows.filter(r=>r.attendance==='yes').length,'Declined: '+rows.filter(r=>r.attendance==='no').length].map(t=>{const s=document.createElement('span');s.textContent=t;return s}));q('main').hidden=false;q('#login').hidden=true;msg.textContent=''}q('#login').onsubmit=async e=>{e.preventDefault();token=q('input').value;q('input').value='';try{await load()}catch(e){token='';msg.textContent=e.message}};q('#refresh').onclick=()=>load().catch(e=>msg.textContent=e.message);q('#logout').onclick=()=>{token='';rows=[];q('tbody').replaceChildren();q('#stats').replaceChildren();q('main').hidden=true;q('#login').hidden=false};q('#export').onclick=()=>{const quote=v=>{let s=String(v??'');if(/^[=+@\\-\\t\\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};const keys=['name','phone','attendance','guests','created_at'];const csv=[keys.join(','),...rows.map(r=>keys.map(k=>quote(r[k])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=url;a.download='baby-kamkam-rsvp.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};</script></html>
